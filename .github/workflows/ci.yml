name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend · lint + testes unitários
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verifica formatação
        run: test -z "$(gofmt -l . | grep -v '^docs/')"
      - name: Verifica Swagger atualizado
        run: |
          go tool swag init -g cmd/api/main.go -o docs --parseInternal --outputTypes go,json
          git diff --exit-code -- docs/
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
      - name: Testes (race detector + cobertura)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - run: go tool cover -func=coverage.out | tail -1

  backend-integration:
    name: Backend · testes de integração (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workevent
          POSTGRES_PASSWORD: workevent
          POSTGRES_DB: workevent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workevent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Testes de integração
        env:
          TEST_DATABASE_URL: postgres://workevent:workevent@localhost:5432/workevent_test?sslmode=disable
        run: go test -tags=integration -count=1 -p 1 ./...

  frontend:
    name: Frontend · lint, tipos, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  docker:
    name: Docker · build das imagens
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: false
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Valida docker-compose
        run: POSTGRES_PASSWORD=ci docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
