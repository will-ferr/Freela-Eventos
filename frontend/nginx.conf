# Nginx do frontend: serve a SPA e faz proxy de /api para o backend.
# Mesma origem para navegador → sem CORS e com cookies SameSite=Strict.

# Gera X-Request-ID quando o cliente não envia — o backend reaproveita o valor,
# então o mesmo id aparece no access log do Nginx e nos logs da API.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format main_json escape=json
    '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"upstream_s":"$upstream_response_time","user_agent":"$http_user_agent"}';

upstream api {
    server ${API_UPSTREAM};
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    access_log /dev/stdout main_json;
    error_log  /dev/stderr warn;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # A API envia seus próprios headers de segurança (CSP por rota, inclusive
        # a exceção do Swagger). Este add_header impede herdar os do server.
        add_header X-Served-By "workevent-edge" always;
    }

    # Endpoints internos nunca são expostos publicamente.
    location = /metrics { return 404; }

    # Assets com hash no nome: cache longo e imutável.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA: qualquer rota cai no index.html (sem cache, para pegar novos deploys).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
