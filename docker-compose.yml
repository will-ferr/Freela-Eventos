# WorkEvent — stack completa.
#
#   docker compose up -d --build                         # app (postgres + api + web)
#   docker compose --profile observability up -d --build # + Prometheus, Grafana, Jaeger
#
# Para desenvolvimento com hot reload, combine com docker-compose.dev.yml.

name: workevent

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  HTTP_PORT: 8080
  # Rede interna do compose: permite ao backend ler o IP real enviado pelo Nginx.
  HTTP_TRUSTED_PROXIES: 172.28.0.0/16
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-workevent}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
  DB_NAME: ${POSTGRES_DB:-workevent}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:5173}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-30}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
  OTEL_SERVICE_NAME: workevent-api
  OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
  OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-1.0}

x-backend-build: &backend-build
  context: ./backend
  target: runtime
  args:
    VERSION: ${APP_VERSION:-dev}
    COMMIT: ${GIT_COMMIT:-none}
    BUILD_TIME: ${BUILD_TIME:-unknown}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workevent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-workevent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposto só em localhost (ferramentas de banco / testes de integração).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Executa as migrations e termina; a API só sobe se elas tiverem sucesso.
  # Mesmo Dockerfile da API (camadas em cache); sem tag própria para não
  # disputar o nome da imagem com o serviço backend durante o build paralelo.
  migrate:
    build: *backend-build
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: workevent-backend:${APP_VERSION:-dev}
    build: *backend-build
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    image: workevent-frontend:${APP_VERSION:-dev}
    build:
      context: ./frontend
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      API_UPSTREAM: backend:8080
    ports:
      - "${FRONTEND_PORT:-8000}:8080"
    depends_on:
      backend:
        condition: service_healthy

  # ---------------- Observabilidade (profile: observability) ----------------

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
